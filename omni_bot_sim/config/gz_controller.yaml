controller_manager:
  ros__parameters:
    update_rate: 1000 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    omni_controller:
      type: forward_command_controller/ForwardCommandController

omni_controller:
  ros__parameters:
    joints:
      - wheel_joint_0
      - wheel_joint_1
      - wheel_joint_2
    interface_name: velocity  # Inaccurate; should be `effort` (change in xacro needed)

joint_state_broadcaster:
  ros__parameters:
    use_urdf_to_filter: true
