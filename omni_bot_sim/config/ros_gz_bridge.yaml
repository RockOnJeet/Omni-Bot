## ros_gz_bridge YAML configuration for common Omni-Bot topics
## NOTE: Many gz topic names and some gz message type names are guesses.
## Please verify the exact Gazebo topic names used by your robot/world and
## adjust the `gz_topic_name` and `gz_type_name` fields accordingly.

## Clock (unidirectional from Gazebo -> ROS)
- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
  lazy: false

## Joint states (model joint states from Gazebo)
- ros_topic_name: "joint_states"
  gz_topic_name: "joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS
  lazy: false

