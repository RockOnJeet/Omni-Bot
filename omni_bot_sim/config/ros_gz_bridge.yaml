## Troubleshooting:
## 1. No /scan topic: Ensure gz-sim-sensors-system plugin is in URDF and bridge is running
## 2. Queue full warnings: Check that LaserScan frame_id (gz_frame_id) is set correctly
## 3. Topics not published: Verify gz_topic_name matches sensor definition
## 4. Timestamp issues: Enable sim_time via clock bridge above
