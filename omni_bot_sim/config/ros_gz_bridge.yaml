## ros_gz_bridge YAML configuration for Omni-Bot ROS2-Gazebo integration
## Reference: LIDAR_SETUP_GZ_ROS.md and YDLidar_G2.md
##
## YDLiDAR G2 Hardware Integration:
## - Sensor: 2D LiDAR, 360° FOV, 0.12-12m range
## - Motor Speed: ~8 Hz (480 RPM) continuous operation
## - Sampling Rate: ~5000 samples/second (~0.36° angular resolution)
## - Communication: UART via USB-TTL @ 230400 bps (plug-and-play)
## - Data Output: Distance + Intensity (factory default)
##
## Bridge Configuration Notes:
## 1. gz_topic_name must match <topic> in sensor definition (e.g., <topic>scan</topic>)
## 2. Bridge converts Gazebo messages to ROS2 sensor_msgs format
## 3. Clock sync is important for sim time and ROS 2 node synchronization
## 4. LiDAR frame_id is set via <gz_frame_id> in sensor definition
## 5. All sensor topics must have matching entries in this bridge config

## Clock (unidirectional from Gazebo -> ROS)
## CRITICAL: Enables sim_time for synchronization across ROS 2 nodes
- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
  lazy: false

## Joint states (model joint states from Gazebo)
- ros_topic_name: "joint_states"
  gz_topic_name: "joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS
  lazy: false

## Joint commands (power joints from ROS) - per wheel
- ros_topic_name: "omni_controller/commands/wheel_0"
  gz_topic_name: "omni_controller/commands/wheel_0"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
  lazy: false

- ros_topic_name: "omni_controller/commands/wheel_1"
  gz_topic_name: "omni_controller/commands/wheel_1"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
  lazy: false

- ros_topic_name: "omni_controller/commands/wheel_2"
  gz_topic_name: "omni_controller/commands/wheel_2"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ
  lazy: false

## LiDAR Scan Data
## CRITICAL: gz_topic_name must match <topic>scan</topic> in lidar sensor definition
## YDLiDAR G2: 360° FOV, 10 Hz update rate (simulated)
## Converts gz.msgs.LaserScan to sensor_msgs/msg/LaserScan with proper frame_id
- ros_topic_name: "scan"
  gz_topic_name: "scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS
  lazy: false

## IMU (Inertial Measurement Unit)
- ros_topic_name: "imu"
  gz_topic_name: "imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
  lazy: false 

## Twist Command (velocity control)
## BIDIRECTIONAL: allows both ROS and Gazebo to control robot velocity
- ros_topic_name: "cmd_vel"
  gz_topic_name: "cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: BIDIRECTIONAL
  lazy: true

