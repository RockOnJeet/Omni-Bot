sim:
  controller_manager:
    ros__parameters:
      update_rate: 100  # Hz
      use_sim_time: true

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      omnidirectional_controller:
        type: velocity_controllers/JointGroupVelocityController

  omnidirectional_controller:
    ros__parameters:
      joints:
        - front_wheel_joint
        - left_wheel_joint
        - right_wheel_joint
